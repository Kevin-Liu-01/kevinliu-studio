# Runs on every pull request, every push to main and by hand (Actions > check > Run workflow): the type check and
# `pnpm build`, which runs every offline check itself, so Vercel's build enforces the same contract. It needs no
# secret and no rounds folder. Vercel builds and deploys on its own; this only reports.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm at the version package.json names in "packageManager"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm check
      # the build is the one gate Vercel runs too: the lint, the tests, the lock, the translation source, the release guard and the
      # Release script (package.json "build"), so CI adds only the type check
      - name: Build and every offline check
        run: pnpm build
